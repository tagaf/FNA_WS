<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AD9643 Live Scope</title>
<style>
:root{
  --bg:#0b0f14; --panel:#131922; --panel2:#0f151d; --line:#243040;
  --fg:#dbe4ef; --dim:#7d8ea6; --accent:#35d6c3; --accent2:#7ee787;
  --warn:#f0a35e; --bad:#f06a6a; --good:#7ee787;
  --seg-cap:#7ee787; --seg-dma:#35d6c3; --seg-gpu:#5ea8f0; --seg-oh:#3a4a5e;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
h1 span{color:var(--accent)}
.badge{font:11px var(--mono);padding:2px 8px;border-radius:999px;
  border:1px solid var(--line);color:var(--dim)}
.badge.on{color:var(--good);border-color:#2b5c3a;background:#12261a}
.badge.off{color:var(--warn);border-color:#5c4a2b;background:#26200f}
.badge.err{color:var(--bad);border-color:#5c2b2b;background:#260f0f}
.tabs{display:flex;gap:6px;padding:8px 16px;background:var(--panel);
  border-bottom:1px solid var(--line)}
.tabbtn{background:transparent;border:1px solid var(--line);color:var(--dim);
  border-radius:6px;padding:5px 14px;font:12px inherit;cursor:pointer}
.tabbtn:hover{color:var(--fg)}
.tabbtn.active{background:#12463f;border-color:#1d6b60;color:#b8fff4}
.nfam{display:flex;align-items:flex-start;gap:8px;padding:5px 12px;
  border-bottom:1px solid #1a222e;font-size:11.5px}
.nfam:last-child{border-bottom:0}
.nfam i{width:9px;height:9px;border-radius:2px;flex:0 0 auto;margin-top:3px}
.nfam .nf{flex:1;min-width:0}
.nfam .nt{font-family:var(--mono);color:var(--fg)}
.nfam .nd{color:var(--dim);font-size:10.5px;line-height:1.35}
#err{display:none;padding:8px 16px;background:#2a1315;color:#ffb4b4;
  font-family:var(--mono);font-size:11px;border-bottom:1px solid #5c2b2b;
  white-space:pre-wrap;word-break:break-word}
.tabpanel{padding:12px}
.mainlayout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
@media(max-width:1100px){.mainlayout{grid-template-columns:minmax(0,1fr)}}
.plots{display:flex;flex-direction:column;gap:12px;min-width:0}
.rowCA{display:flex;flex-direction:column;gap:12px;min-width:0}
.diaglayout{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.card h2{font-size:12px;margin:0;padding:8px 12px;color:var(--dim);
  font-weight:600;letter-spacing:.4px;text-transform:uppercase;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.card h2 em{font-style:normal;color:var(--fg);font-family:var(--mono)}
.card h2 span{display:flex;align-items:center;gap:8px}
.card h2 button{background:#1b2431;color:var(--warn);border:1px solid #5c4a2b;
  border-radius:5px;padding:2px 8px;font:11px var(--mono);cursor:pointer}
.card h2 button:hover{background:#243141}
.card h2 label.chk{display:flex;align-items:center;gap:5px;cursor:pointer;
  color:var(--dim);text-transform:none;letter-spacing:0;font-weight:500;
  font-size:11px}
.card h2 label.chk:hover{color:var(--fg)}
.card h2 label.chk input{width:auto;margin:0;padding:0;accent-color:var(--accent)}
#cFreq{cursor:crosshair}
canvas{display:block;width:100%;height:280px;background:var(--panel2)}
.ctl{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;padding:12px;align-items:center}
.ctl label{color:var(--dim);font-size:12px}
select,input{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:5px;padding:5px 7px;font:12px var(--mono);width:100%;
  transition:outline-color .15s}
select.pending{outline:2px solid var(--warn);outline-offset:-1px}
select.applied{outline:2px solid var(--good);outline-offset:-1px}
.btn{grid-column:1/-1;display:flex;gap:8px;margin-top:4px}
button{flex:1;background:#1b2431;color:var(--fg);border:1px solid var(--line);
  border-radius:5px;padding:7px;font:12px/1 inherit;cursor:pointer}
button:hover{background:#243141}
button:disabled{opacity:.55;cursor:default}
button.pri{background:#12463f;border-color:#1d6b60;color:#b8fff4}
button.pri:hover{background:#166055}
button.dang{background:#2a1315;border-color:#5c2b2b;color:#ffb4b4}
button.dang:hover{background:#3a1a1c}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
td{padding:3px 12px;border-bottom:1px solid #1a222e}
td:first-child{color:var(--dim);white-space:nowrap}
td:last-child{text-align:right;color:var(--fg);white-space:nowrap}
tr:last-child td{border-bottom:0}
.v-good{color:var(--good)}.v-warn{color:var(--warn)}.v-bad{color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);
  display:inline-block;vertical-align:middle}
@keyframes acqpulse{0%{background:var(--good);box-shadow:0 0 9px var(--good)}
  100%{background:var(--dim);box-shadow:0 0 0 rgba(0,0,0,0)}}
.dot.flash{animation:acqpulse .55s ease-out}
.tbarwrap{padding:10px 12px 4px}
.tbar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:#0e141c}
.tbar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:6px 12px 10px;font-size:10.5px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
</style></head><body>

<header>
  <h1>AD9643 <span>Live Scope</span></h1>
  <span class="badge" id="st">connecting…</span>
  <span><span class="dot" id="acqDot"></span> <span class="badge" id="stAcq">–</span></span>
  <span class="badge" id="stFps">– fps</span>
  <span class="badge" id="stSrc">–</span>
  <span class="badge" id="stCov">–</span>
  <span class="badge" id="stNet" title="Orin WiFi link (RSSI · TX rate) and network lag: how much later each frame arrives at this browser than the engine produced it. The long-poll transport self-adapts: on a slow link you get the newest frame at whatever rate the link sustains — no backlog builds up.">net –</span>
</header>

<div class="tabs">
  <button class="tabbtn active" data-tab="main">Main</button>
  <button class="tabbtn" data-tab="diag">Diagnostics</button>
</div>
<div id="err"></div>

<div id="tabMain" class="tabpanel">
  <div class="mainlayout">
    <div class="plots">
      <div class="card">
        <h2>Time domain
          <span>
            <label class="chk" title="Lock the vertical axis to the ADC's full 14-bit range (0–16383 codes). Autoscaling makes a shrinking signal look unchanged because the axis shrinks with it; full scale shows how much of the converter you are actually using.">
              <input type="checkbox" id="tLock"> full scale
            </label>
            <em id="tdInfo">–</em>
          </span>
        </h2>
        <canvas id="cTime"></canvas>
      </div>
      <div class="card">
        <h2>Spectrum — log/log (CUDA cuFFT)
          <span>
            <label class="chk" title="Persistence / density display, as on a real-time spectrum analyser. Every trace is accumulated into a frequency x amplitude histogram and coloured by how often each cell is hit, so rare transients stay visible and the steady noise floor separates from intermittent signals. Accumulated in the browser, so it costs no extra bandwidth.">
              persist
            </label>
            <select id="persist" style="width:auto"></select>
            <button id="bZoomReset" style="display:none">⤢ Reset zoom</button>
            <em id="fdInfo">–</em>
          </span>
        </h2>
        <canvas id="cFreq" title="drag to zoom into a frequency band (full resolution) · double-click to reset"></canvas>
      </div>
    </div>

    <div class="rowCA">
      <div class="card">
        <h2>Control</h2>
        <div class="ctl">
          <label>Channel</label>
          <select id="channel">
            <option value="1">1 — ADC A</option>
            <option value="2">2 — ADC B</option>
            <option value="3">3 — A + B simultaneously</option>
            <option value="0">0 — internal test ramp (FPGA counter)</option>
          </select>
          <label>Samples</label>
          <select id="nsamples"></select>
          <label title="Does NOT change the sample rate. It gates only the capture FSM's sample counter, so the data is always 250 Msps and the capture just takes (n+1) times longer. Leave at 0.">Capture stretch</label>
          <select id="speed"></select>
          <label>FFT size</label>
          <select id="nfft"></select>
          <label>FFT frames</label>
          <select id="max_frames" title="Welch segments averaged inside every capture. 1 = a true single FFT per capture (fluctuating noise floor); higher = smoother floor. This was hard-wired to 64 before, which is why the spectrum looked averaged even with the EMA off."></select>
          <label>Sensitivity</label>
          <select id="pfa_exp" title="Detection false-alarm probability. Lower Pfa = stricter = fewer marks. With no averaging a single FFT bin fluctuates by ~11 dB, so a strict threshold legitimately rejects bumps that are just noise; raising Welch frames or Trace avg is the physical way to reveal weak real peaks."></select>
          <label>Classify</label>
          <select id="classify" title="Detect spectral peaks (CFAR), group them into harmonic families, and label them. Runs ~1x/s in a background thread on the full-resolution spectrum, so it does not slow the capture loop."></select>
          <label>Trace avg</label>
          <select id="avg" title="Exponential average ACROSS captures (display smoothing). 1 = off"></select>
          <div class="btn">
            <button class="pri" id="bRun">▶ Run</button>
            <button id="bSingle">⚡ Single</button>
            <button id="bReset">Reset</button>
          </div>
          <div class="btn">
            <button class="dang" id="bRestart" title="Restarts the whole server process on the Jetson -- drops every connected viewer's live feed for a few seconds, not just yours">⟲ Restart server</button>
          </div>
        </div>
      </div>

      <div class="card" id="cardNoise" style="display:none">
        <h2>Noise sources <em id="noiseInfo">–</em></h2>
        <div id="noiseList"></div>
        <div class="note" id="noiseNote"></div>
      </div>

      <div class="card"><h2>Acquisition <em id="acqInfo">–</em></h2><table id="tAcq"></table>
        <div class="tbarwrap">
          <div class="tbar" id="tbar"></div>
          <div class="legend" id="tbarLegend"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="tabDiag" class="tabpanel" style="display:none">
  <div class="diaglayout">
    <div class="card"><h2>GPU / CUDA</h2><table id="tGpu"></table></div>
    <div class="card"><h2>Signal</h2><table id="tSig"></table></div>
    <div class="card"><h2>System</h2><table id="tSys"></table></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const fill=(el,rows)=>{el.innerHTML=rows.map(r=>
  `<tr><td>${r[0]}</td><td class="${r[2]||''}">${r[1]}</td></tr>`).join('')};
const f=(v,n=2)=>(v==null||!isFinite(v))?'–':v.toFixed(n);
const si=b=>{const u=['B','KB','MB','GB','TB'];let i=0;b=b||0;
  while(b>=1024&&i<u.length-1){b/=1024;i++}return b.toFixed(i?1:0)+' '+u[i]};
const eng=(h)=>{if(!isFinite(h))return '–';
  if(h>=1e6)return (h/1e6).toFixed(4)+' MHz';
  if(h>=1e3)return (h/1e3).toFixed(3)+' kHz';return h.toFixed(1)+' Hz'};
const axTimeUnit=spanS=>spanS>=1?[1,'s']:spanS>=1e-3?[1e3,'ms']
  :spanS>=1e-6?[1e6,'µs']:[1e9,'ns'];
const axNum=v=>v>=100?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(2);
const axFreq=v=>{if(!isFinite(v))return '–';
  if(v>=1e6)return (v/1e6).toFixed(v>=1e7?0:1)+'M';
  if(v>=1e3)return (v/1e3).toFixed(v>=1e4?0:1)+'k';return v.toFixed(0)};
const dur=s=>{s=Math.floor(s);const h=(s/3600)|0,m=((s%3600)/60)|0;
  return h?`${h}h ${m}m`:(m?`${m}m ${s%60}s`:`${s}s`)};
const ago=s=>s<1?'just now':s<60?s.toFixed(1)+'s ago':dur(s)+' ago';

// ---- tabs
document.querySelectorAll('.tabbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tabbtn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  const t=b.dataset.tab;
  $('tabMain').style.display=t==='main'?'':'none';
  $('tabDiag').style.display=t==='diag'?'':'none';
}));

// ---- populate selectors
const opts=(el,vals,fmt,sel)=>{el.innerHTML=vals.map(v=>
  `<option value="${v}"${v==sel?' selected':''}>${fmt(v)}</option>`).join('')};
const NSAMPLE_BASE=[4096,16384,65536,262144,1048576,4194304,16777216,67108864];
let MAX_SAMPLES=262144000;
const pow2Floor=n=>Math.pow(2,Math.floor(Math.log2(Math.max(1,n))));
let autoNfft=true;                       // default: FFT length follows Samples
const NFFT_AUTO_CAP=1<<27;   // 134M-pt validated on this GPU: 116 ms, ~1 GB
const effAutoNfft=()=>pow2Floor(Math.min(+$('nsamples').value||1048576,NFFT_AUTO_CAP));
// FFT size can be at most the sample count (nfft > nsamples yields 0 frames
// and errors) -- so its range is rebuilt every time nsamples changes,
// capped overall at the largest power of two the true hardware max allows.
function buildNfftOpts(capSamples){
  const hardCeil=pow2Floor(MAX_SAMPLES);          // 134,217,728 at the true max
  const top=Math.min(pow2Floor(capSamples),hardCeil);
  const vals=[];
  for(let v=1024;v<=top;v*=2)vals.push(v);
  if(!vals.length)vals.push(1024);
  const curRaw=$('nfft').value, cur=+curRaw||8192;
  const sel=(autoNfft||curRaw==='auto'||curRaw==='')?'auto'
            :(vals.includes(cur)?cur:vals[vals.length-1]);
  $('nfft').innerHTML=['<option value="auto"'+(sel==='auto'?' selected':'')
      +'>auto — follow samples</option>']
    .concat(vals.map(v=>`<option value="${v}"${v===sel?' selected':''}>`
      +v.toLocaleString()+(v===hardCeil?' — MAX':'')+'</option>')).join('');
}
function buildNsampleOpts(maxSamples){
  MAX_SAMPLES=maxSamples;
  let vals=NSAMPLE_BASE.filter(v=>v<=maxSamples);
  if(!vals.includes(maxSamples))vals.push(maxSamples);
  const fs=250e6/((+($('speed')&&$('speed').value)||0)+1);
  const cur=+$('nsamples').value||1048576;
  opts($('nsamples'),vals,
       v=>v.toLocaleString()+' · '+fmtDur(v/fs)+(v===maxSamples?' — MAX':''),
       vals.includes(cur)?cur:1048576);
  buildNfftOpts(+$('nsamples').value);
}
buildNsampleOpts(MAX_SAMPLES); // sane default before /limits answers
fetch('/limits',{cache:'no-store'}).then(r=>r.json()).then(lim=>{
  buildNsampleOpts(lim.max_samples);
}).catch(()=>{});
// Speed_Set does NOT change the sample rate: it gates only the sample
// counter, not the FIFO write enable, so DDR always gets 250 Msps data and
// the capture simply takes (n+1)x longer. See NOTES.md #26.
opts($('speed'),[0,1,3,7,15,31,63,255],
     v=>v===0?'0 — normal':`${v} — ${v+1}× slower capture, same 250 Msps`,0);
opts($('avg'),[1,2,4,8,16,32],v=>v==1?'1 (off)':v+'\u00d7 EMA',4);
opts($('classify'),[0,1],v=>v?'on — label noise sources':'off',0);
opts($('persist'),[0,0.5,2,10,-1],
     v=>({0:'off',0.5:'0.5 s',2:'2 s',10:'10 s','-1':'hold'})[v],0);
opts($('pfa_exp'),[2,3,4,6,9],
     v=>({2:'1e-2 — most marks',3:'1e-3 — sensitive',4:'1e-4',
          6:'1e-6 — default',9:'1e-9 — strict'})[v],6);
opts($('max_frames'),[1,2,4,8,16,32,64,128,256],v=>v==1?'1 (single FFT)':v+'\u00d7 Welch',64);
function fmtDur(sec){const [k,u]=axTimeUnit(sec);return axNum(sec*k)+' '+u}

// ---- pending/applied confirmation for control changes
const CTL_IDS=['channel','nsamples','speed','nfft','avg','max_frames','classify','pfa_exp'];
const pending={};
function markPending(id){
  pending[id]=$(id).value;
  $(id).classList.add('pending');$(id).classList.remove('applied');
  if(id==='channel'||id==='nfft'){tBounds=null;fBounds=null} // scale likely changes
}
function checkApplied(m){
  CTL_IDS.forEach(id=>{
    if(id in pending && String(m.cfg[id])===pending[id]){
      delete pending[id];
      $(id).classList.remove('pending');$(id).classList.add('applied');
      setTimeout(()=>$(id).classList.remove('applied'),700);
    }
  });
}
function sendNfft(eff){
  pending['nfft']=String(eff);
  $('nfft').classList.add('pending');$('nfft').classList.remove('applied');
  fBounds=null;send({nfft:eff});
}
CTL_IDS.forEach(id=>$(id).addEventListener('change',()=>{
  const raw=$(id).value;
  if(id==='nfft'){
    autoNfft=(raw==='auto');
    sendNfft(autoNfft?effAutoNfft():+raw);
    return;
  }
  markPending(id);send({[id]:+raw});
  if(id==='speed'){buildNsampleOpts(MAX_SAMPLES)}
  if(id==='nsamples'){
    const prevRaw=$('nfft').value;
    buildNfftOpts(+raw);                   // manual nfft is capped at nsamples
    if(autoNfft){sendNfft(effAutoNfft())}  // FFT follows the record length
    else if($('nfft').value!==prevRaw){sendNfft(+$('nfft').value)}
  }
}));
// align the server (which boots at nfft=8192) with the auto default.
// Deferred: sendNfft touches fBounds, whose `let` further down has not run
// yet at this point in script evaluation (TDZ).
setTimeout(()=>sendNfft(effAutoNfft()),0);

// ---- canvas helpers
// Reassigning canvas.width/height reallocates + clears the whole backing
// store; doing that every frame on two canvases was measurable jank. Only
// touch it when the CSS size or devicePixelRatio actually changed.
const _cvState=new WeakMap();
function setup(cv){const d=window.devicePixelRatio||1,r=cv.getBoundingClientRect();
  const st=_cvState.get(cv);
  if(!st||st.w!==r.width||st.h!==r.height||st.d!==d){
    cv.width=r.width*d;cv.height=r.height*d;
    _cvState.set(cv,{w:r.width,h:r.height,d});
  }
  const c=cv.getContext('2d');
  c.setTransform(d,0,0,d,0,0);return {c,w:r.width,h:r.height}}
const PAD={l:52,r:10,t:10,b:22};
function axes(c,w,h,xt,yt,xl,yl){
  const x0=PAD.l,y0=PAD.t,pw=w-PAD.l-PAD.r,ph=h-PAD.t-PAD.b;
  c.clearRect(0,0,w,h);
  c.strokeStyle='#1c2531';c.lineWidth=1;c.fillStyle='#5f7188';
  c.font='10px ui-monospace,monospace';
  xt.forEach(t=>{const x=x0+pw*t.p;c.beginPath();c.moveTo(x,y0);c.lineTo(x,y0+ph);c.stroke();
    c.textAlign='center';c.fillText(t.l,x,h-7)});
  yt.forEach(t=>{const y=y0+ph*(1-t.p);c.beginPath();c.moveTo(x0,y);c.lineTo(x0+pw,y);c.stroke();
    c.textAlign='right';c.fillText(t.l,x0-6,y+3)});
  c.strokeStyle='#2b3849';c.strokeRect(x0,y0,pw,ph);
  return {x0,y0,pw,ph,c};
}

// ---- autoscale with light smoothing so bounds don't jump every frame
let tBounds=null, fBounds=null, fHold=null;
// 14-bit TWO'S COMPLEMENT: codes run -8192..+8191 (NOTES.md section 27).
// 1.75 V full scale / 8192 codes, per the vendor client.
const ADC_MIN=-8192, ADC_MAX=8191;
let VOLT_SCALE=1.75/8192;
const mV=c=>c*VOLT_SCALE*1000;
let tLock=false;                     // lock the time-domain Y to full scale
function ema(prev,lo,hi,k){
  if(!prev||!isFinite(prev.lo)||!isFinite(prev.hi))return {lo,hi};
  return {lo:prev.lo+(lo-prev.lo)*k, hi:prev.hi+(hi-prev.hi)*k};
}
// "nice" decade ticks for a log axis; falls back to the two endpoints if the
// range doesn't span a full decade
function logTicks(lo,hi){
  const p0=Math.floor(Math.log10(lo)), p1=Math.ceil(Math.log10(hi));
  const out=[];
  for(let p=p0;p<=p1;p++){const v=Math.pow(10,p);if(v>=lo&&v<=hi)out.push(v)}
  return out.length>=2?out:[lo,hi];
}

function drawTime(m,T){
  const {c,w,h}=setup($('cTime'));
  const n=T[0].tmin.length;
  let lo=Infinity,hi=-Infinity;
  for(const t of T)for(let i=0;i<n;i++){if(t.tmin[i]<lo)lo=t.tmin[i];if(t.tmax[i]>hi)hi=t.tmax[i]}
  if(!isFinite(lo)){lo=0;hi=16383}
  const pad=Math.max(4,(hi-lo)*0.08);lo-=pad;hi+=pad;
  // keep tracking the live range even while locked, so unlocking resumes
  // from where the signal actually is rather than snapping
  tBounds=ema(tBounds,lo,hi,0.3);
  if(tLock){lo=ADC_MIN;hi=ADC_MAX}
  else{lo=tBounds.lo;hi=tBounds.hi}
  const dur_s=(m.acq.trace_samples||m.acq.read_samples||m.cfg.nsamples)/m.fs_hz;
  const [tk,tu]=axTimeUnit(dur_s);
  const xt=[0,.25,.5,.75,1].map(p=>({p,l:axNum(dur_s*p*tk)+tu}));
  // codes are meaningless to read off; label the axis in millivolts
  const yt=[0,.25,.5,.75,1].map(p=>{const cval=lo+(hi-lo)*p;
    const v=mV(cval);
    return {p,l:Math.abs(v)>=1000?(v/1000).toFixed(2)+'V':v.toFixed(Math.abs(v)<10?2:1)};});
  const g=axes(c,w,h,xt,yt);
  const Y=v=>g.y0+g.ph*(1-(v-lo)/(hi-lo));
  // one envelope band + mean line per trace, in that trace's colour
  T.forEach((t,k)=>{
    c.beginPath();
    for(let i=0;i<n;i++){const x=g.x0+g.pw*i/(n-1);i?c.lineTo(x,Y(t.tmax[i])):c.moveTo(x,Y(t.tmax[i]))}
    for(let i=n-1;i>=0;i--){const x=g.x0+g.pw*i/(n-1);c.lineTo(x,Y(t.tmin[i]))}
    c.closePath();c.fillStyle=TRACE_FILL[k%TRACE_FILL.length];c.fill();
    c.strokeStyle=TRACE_COLORS[k%TRACE_COLORS.length];c.lineWidth=1;
    c.beginPath();
    for(let i=0;i<n;i++){const x=g.x0+g.pw*i/(n-1);
      // true per-column mean, not (min+max)/2 -- the envelope midpoint sits
      // where no sample necessarily is once the signal is asymmetric
      const y=Y(t.tmean?t.tmean[i]:(t.tmin[i]+t.tmax[i])/2);
      i?c.lineTo(x,y):c.moveTo(x,y)}
    c.stroke();
  });
  $('tdInfo').innerHTML=traceLegend(T)
    + `${m.cfg.nsamples.toLocaleString()} pts · ${axNum(dur_s*tk)} ${tu}`
    + ` · shaded = min…max, line = mean`
    + (tLock?` · full scale ±1.75 V`:' · autoscaled') + ' · mV';
}

// Spectrum: log frequency (x) × dB (y, already log-magnitude) = log-log for
// the always-sent downsampled overview. A drag-select on the canvas asks the
// server for a full-resolution slice of just that band (see poll()/send()
// below) -- shown here with a linear x-axis, since a narrow zoomed band
// gains little from log spacing and log breaks down if the band starts near
// 0 Hz. Per-pixel max-hold over the bin range each pixel covers either way,
// so a peak never gets skipped whether a pixel spans many bins or a bin
// spans many pixels.
// ---- persistence / density display -------------------------------------
// A real-time analyser builds a frequency x amplitude histogram over many
// traces and colours each cell by hit rate, so a rare transient stays on
// screen next to the steady noise floor instead of being averaged into it.
// Accumulated client-side from the spectra already being sent: no extra
// bandwidth, and it works identically in the zoomed view.
let persistTau=0;                 // seconds; 0 = off, <0 = infinite hold
let pHist=null,pW=0,pH=0,pKey='',pLast=0,pCanvas=null,pImg=null;

function persistKey(m,fLo,fHi,lo,hi,w,h){
  // the histogram is tied to an axis mapping; any change invalidates it
  return [m.cfg.channel,m.cfg.nfft,Math.round(m.fs_hz),
          fLo.toFixed(1),fHi.toFixed(1),lo.toFixed(1),hi.toFixed(1),w,h].join('|');
}
function persistEnsure(key,w,h){
  if(pKey===key&&pHist&&pW===w&&pH===h)return false;
  pKey=key;pW=w;pH=h;
  pHist=new Float32Array(w*h);
  pCanvas=document.createElement('canvas');pCanvas.width=w;pCanvas.height=h;
  pImg=pCanvas.getContext('2d').createImageData(w,h);
  pLast=performance.now();
  return true;
}
// Cells saturate rather than counting without bound. Otherwise a steady
// noise floor grows for as long as the display runs while a one-off
// transient stays at 1, so the very events persistence exists to show fade
// to invisible -- worst in hold mode, where the floor never decays.
const P_CAP=64;
// blue -> cyan -> green -> yellow -> red, the conventional density ramp,
// precomputed: a per-cell function call over ~400k cells每 frame is not free
const P_LUT=(()=>{
  const L=new Uint8ClampedArray(256*4);
  for(let i=0;i<256;i++){
    const t=i/255;let r,g,b;
    if(t<0.25){const u=t/0.25;r=0;g=90*u;b=60+150*u}
    else if(t<0.5){const u=(t-0.25)/0.25;r=0;g=90+140*u;b=210-70*u}
    else if(t<0.75){const u=(t-0.5)/0.25;r=200*u;g=230;b=140-140*u}
    else{const u=(t-0.75)/0.25;r=200+55*u;g=230-140*u;b=0}
    L[i*4]=r;L[i*4+1]=g;L[i*4+2]=b;
    L[i*4+3]=30+225*Math.min(1,t*2.2);      // let the empty floor stay dark
  }
  return L;
})();
function persistDraw(c,g,pts,pxN,Y,m,fLo,fHi,lo,hi){
  const w=Math.max(1,Math.round(g.pw)),h=Math.max(1,Math.round(g.ph));
  const reset=persistEnsure(persistKey(m,fLo,fHi,lo,hi,w,h),w,h);
  const now=performance.now();
  const dt=Math.max(0,(now-pLast)/1000);pLast=now;
  // time-based decay so the look does not change with frame rate
  if(!reset&&persistTau>0){   // persistTau < 0 means hold: never decay
    const k=Math.exp(-dt/persistTau);
    if(k<0.999)for(let i=0;i<pHist.length;i++)pHist[i]*=k;
  }
  // accumulate this trace, joining consecutive samples so it reads as a line
  const row=v=>{
    const y=(1-(v-lo)/(hi-lo))*h;
    return y<0?0:(y>=h?h-1:y|0);
  };
  let prev=null;
  for(let px=0;px<pxN&&px<w;px++){
    const v=pts[px];
    if(v==null||!isFinite(v)){prev=null;continue}
    const r1=row(v), r0=prev==null?r1:prev; prev=r1;
    const a=Math.min(r0,r1), b=Math.max(r0,r1);
    for(let r=a;r<=b;r++){const i=r*w+px;if(pHist[i]<P_CAP)pHist[i]+=1}
  }
  // normalise against a high quantile so one hot cell cannot wash it out
  let mx=0;
  for(let i=0;i<pHist.length;i++)if(pHist[i]>mx)mx=pHist[i];
  if(mx<=0)return;
  // gamma lifts sparse hits; precomputed against the running max so the
  // mapping is one multiply and a table lookup per cell
  const g255=new Uint16Array(P_CAP+1);
  for(let v=0;v<=P_CAP;v++)g255[v]=Math.min(255,Math.round(255*Math.pow(v/mx,0.45)));
  const d=pImg.data;
  for(let i=0,px=0;i<pHist.length;i++,px+=4){
    const v=pHist[i];
    if(v<=0){d[px+3]=0;continue}
    const c4=g255[v<=P_CAP?v|0:P_CAP]*4;
    d[px]=P_LUT[c4];d[px+1]=P_LUT[c4+1];d[px+2]=P_LUT[c4+2];d[px+3]=P_LUT[c4+3];
  }
  pCanvas.getContext('2d').putImageData(pImg,0,0);
  c.drawImage(pCanvas,g.x0,g.y0);
}

// max-pool a spectrum onto plot pixels; shared so every trace maps identically
function perPixel(spec,pxN,fromP,binHz,base,n,zoomed){
  const pts=new Array(pxN);
  for(let px=0;px<pxN;px++){
    let i0,i1;
    if(zoomed){       // linear full-res slice: map pixel->freq->bin index
      const f0=fromP(px/pxN),f1=fromP((px+1)/pxN);
      i0=Math.max(0,Math.round((f0-base)/binHz));
      i1=Math.min(n-1,Math.max(i0,Math.round((f1-base)/binHz)));
    }else{            // log-spaced points are uniform along the log axis
      i0=Math.floor(n*px/pxN);
      i1=Math.min(n-1,Math.max(i0,Math.floor(n*(px+1)/pxN)-1));
    }
    let v=-1e9;
    for(let j=i0;j<=i1;j++) if(spec[j]>v) v=spec[j];
    pts[px]=(v===-1e9)?spec[Math.min(n-1,Math.max(0,i0))]:v;
  }
  return pts;
}

let freqAxis=null;   // latest {x0,pw,fromP} so drag-select can invert pixel->Hz
function drawFreq(m,T,zoomSpec){
  const dispSpec=T[0].spec;
  const {c,w,h}=setup($('cFreq'));
  const fmax=m.fs_hz/2;
  const zoomed=!!(m.zoom&&m.zoom.active&&zoomSpec&&zoomSpec.length>1);
  const spec=zoomed?zoomSpec:dispSpec;
  const n=spec.length;
  const binHz=zoomed?m.zoom.bin_hz:m.bin_hz;
  const base=zoomed?m.zoom.lo_hz:0;
  // overview: log-spaced points from the true first bin to Nyquist, so a
  // longer record visibly extends the axis downward (31 kHz floor is gone)
  const fLo=zoomed?Math.max(m.zoom.lo_hz,1e-6):Math.max(m.disp_f0||m.bin_hz,1e-3);
  const fHi=zoomed?m.zoom.hi_hz:(m.disp_f1||fmax);
  // Log vs linear is about the SPAN, not about being zoomed. A zoom of
  // 10 kHz-14 MHz is three decades: drawn linearly the first decade gets
  // 0.6% of the width, so a sparse low end looks identical to an empty one
  // and the tick labels jump 10k -> 2.7M. Use log whenever the band covers
  // more than a decade and starts above DC.
  const useLog=!zoomed||(fLo>0&&fHi/fLo>=10);

  let lo=Infinity,hi=-Infinity;
  for(let i=0;i<n;i++){const v=spec[i];if(v<lo)lo=v;if(v>hi)hi=v} // overview already excludes DC
  if(!isFinite(lo)){lo=-120;hi=0}
  const span=Math.max(10,hi-lo);
  lo-=span*0.08;hi+=span*0.18; // extra headroom above so the peak label fits
  fBounds=ema(fBounds,lo,hi,0.15);
  // Persistence is tied to a fixed amplitude mapping: if the axis kept
  // drifting under it the histogram would smear (and reset) every frame.
  // Hold the range while it accumulates, re-snapping only on a real change,
  // which is also how an analyser behaves with a set reference level.
  if(persistTau!==0){
    if(!fHold||Math.abs(fBounds.lo-fHold.lo)>6||Math.abs(fBounds.hi-fHold.hi)>6)
      fHold={lo:fBounds.lo,hi:fBounds.hi};
    lo=fHold.lo;hi=fHold.hi;
  }else{fHold=null;lo=fBounds.lo;hi=fBounds.hi}

  const logLo=Math.log10(fLo),logHi=Math.log10(Math.max(fLo*1.0001,fHi));
  const toP=freq=>useLog?(Math.log10(Math.max(fLo,freq))-logLo)/(logHi-logLo):(freq-fLo)/(fHi-fLo);
  const fromP=p=>useLog?Math.pow(10,logLo+(logHi-logLo)*p):fLo+(fHi-fLo)*p;

  const xt=useLog
    ?logTicks(fLo,fHi).map(v=>({p:toP(v),l:axFreq(v)}))
    :[0,.2,.4,.6,.8,1].map(p=>({p,l:axFreq(fLo+(fHi-fLo)*p)}));
  const yt=[0,.25,.5,.75,1].map(p=>({p,l:Math.round(lo+(hi-lo)*p)}));
  const g=axes(c,w,h,xt,yt);
  const Y=v=>g.y0+g.ph*(1-(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo));
  const Xf=freq=>g.x0+g.pw*toP(freq);
  freqAxis={x0:g.x0,pw:g.pw,fromP};

  const pxN=Math.max(1,Math.floor(g.pw));
  const pts=perPixel(spec,pxN,fromP,binHz,base,n,zoomed);
  if(persistTau!==0){
    persistDraw(c,g,pts,pxN,Y,m,fLo,fHi,lo,hi);
    // faint live trace over the density so "now" is still identifiable
    c.beginPath();
    for(let px=0;px<pxN;px++){const y=Y(pts[px]);px?c.lineTo(g.x0+px,y):c.moveTo(g.x0+px,y)}
    c.strokeStyle='rgba(230,245,255,.5)';c.lineWidth=1;c.stroke();
  }else{
    const multi=(!zoomed&&T.length>1);
    if(!multi){
      const grad=c.createLinearGradient(0,g.y0,0,g.y0+g.ph);
      grad.addColorStop(0,'rgba(53,214,195,.35)');grad.addColorStop(1,'rgba(53,214,195,0)');
      c.beginPath();c.moveTo(g.x0,g.y0+g.ph);
      for(let px=0;px<pxN;px++)c.lineTo(g.x0+px,Y(pts[px]));
      c.lineTo(g.x0+pxN,g.y0+g.ph);c.closePath();c.fillStyle=grad;c.fill();
      c.beginPath();
      for(let px=0;px<pxN;px++){const y=Y(pts[px]);px?c.lineTo(g.x0+px,y):c.moveTo(g.x0+px,y)}
      c.strokeStyle=zoomed?'#f0a35e':'#35d6c3';c.lineWidth=1;c.stroke();
    }else{
      // dual: no fill (two filled bands would hide each other), just lines
      T.forEach((t,k)=>{
        const p=perPixel(t.spec,pxN,fromP,binHz,base,n,zoomed);
        c.beginPath();
        for(let px=0;px<pxN;px++){const y=Y(p[px]);px?c.lineTo(g.x0+px,y):c.moveTo(g.x0+px,y)}
        c.strokeStyle=TRACE_COLORS[k%TRACE_COLORS.length];c.lineWidth=1;c.stroke();
      });
    }
  }
  // peak marker
  if(m.sig.peak_hz>=fLo&&m.sig.peak_hz<=fHi){
    const x=Xf(m.sig.peak_hz),y=Y(m.sig.peak_db);
    c.strokeStyle='#f0a35e';c.setLineDash([3,3]);c.beginPath();
    c.moveTo(x,g.y0);c.lineTo(x,g.y0+g.ph);c.stroke();c.setLineDash([]);
    c.fillStyle='#f0a35e';c.beginPath();c.arc(x,y,3,0,7);c.fill();
    c.textAlign=x>w*.7?'right':'left';c.font='10px ui-monospace,monospace';
    c.fillText(`${eng(m.sig.peak_hz)}  ${f(m.sig.peak_db,1)} dBFS`,x+(x>w*.7?-6:6),g.y0+12)}
  $('fdInfo').innerHTML=zoomed
    ?`zoom ${axFreq(fLo)}–${axFreq(fHi)} · ${n.toLocaleString()} pts full-res · ${eng(binHz)}/bin · ${useLog?'log':'linear'}`
    :traceLegend(T)+`${persistTau?(persistTau<0?'HOLD · ':'PERSIST '+persistTau+'s · '):''}${m.nframes}× ${m.cfg.nfft.toLocaleString()}-pt (${fmtDur(m.cfg.nfft/m.fs_hz)} → Δf ${eng(m.bin_hz)}) · analysed ${fmtDur(m.nframes*m.cfg.nfft/m.fs_hz)} of ${fmtDur(m.cfg.nsamples/m.fs_hz)} · Hann · log/log`;
  drawThreshold(m,g,Y,pxN);
  drawNoiseMarkers(m,g,Xf,Y,fLo,fHi,pts,pxN);
  $('bZoomReset').style.display=zoomed?'':'none';
}

// One hue per family, chosen to stay distinguishable against the trace
// (cyan) and the peak marker (amber).
const FAM_COLORS=['#f06a6a','#b48ef0','#7ee787','#f0a35e','#5ea8f0',
                  '#e86ab8','#d6d635','#59d6c3'];
const SPUR_COLOR='#8fa3bd';
// Structure cache: family member frequencies and the spur list arrive on
// /noise and change only when the analysis does, so they are fetched on a
// `sid` change rather than riding every frame (hundreds of frequencies would
// dominate the payload on a slow link).
let noiseStruct=null, noiseSidWanted=-1, noiseFetching=false;
async function ensureNoiseStruct(sid){
  if(sid==null||noiseFetching)return;
  if(noiseStruct&&noiseStruct.sid===sid)return;
  if(noiseSidWanted===sid&&noiseStruct)return;
  noiseFetching=true;noiseSidWanted=sid;
  try{
    const r=await fetch('/noise',{cache:'no-store'});
    if(r.ok){const j=await r.json(); if(j&&j.sid)noiseStruct=j}
  }catch(e){}finally{noiseFetching=false}
}
// At full coverage there can be thousands of peaks against ~1200 plot
// pixels, so most markers would overdraw each other and cost canvas calls
// for nothing. Reduce to at most one marker per pixel, keeping the most
// prominent -- visually identical, and zooming still reveals the rest
// because the full list is held client-side.
let _bkP=null,_bkI=null;
function pixelReduce(freqs,proms,Xf,x0,pxN,fLo,fHi){
  if(!_bkP||_bkP.length<pxN){_bkP=new Float32Array(pxN);_bkI=new Int32Array(pxN)}
  _bkP.fill(-1e30,0,pxN);_bkI.fill(-1,0,pxN);
  const n=freqs.length;
  for(let i=0;i<n;i++){
    const f=freqs[i];
    if(f<fLo||f>fHi)continue;
    const px=Math.round(Xf(f)-x0);
    if(px<0||px>=pxN)continue;
    const p=proms?proms[i]:0;
    if(p>_bkP[px]){_bkP[px]=p;_bkI[px]=i}
  }
  return _bkI;
}
function plotAt(x,g,pts,pxN,fallback){
  if(!pts||!pxN)return fallback;
  const px=Math.max(0,Math.min(pxN-1,Math.round(x-g.x0)));
  const v=pts[px];
  return (v==null||!isFinite(v))?fallback:v;
}
function famColor(i){return FAM_COLORS[i%FAM_COLORS.length]}

// The CFAR detection threshold, on the same log grid as the overview. A
// bump below this line is not "missed" -- at the current averaging depth it
// is statistically indistinguishable from noise. Drawing it turns "why is
// that peak unmarked?" into something you can just look at.
function drawThreshold(m,g,Y,pxN){
  const an=m.analysis;
  if(!an||an.stale)return;
  const st=(noiseStruct&&noiseStruct.sid===an.sid)?noiseStruct:null;
  const tc=st&&st.thr_curve;
  if(!tc||tc.length<2)return;
  if(m.zoom&&m.zoom.active)return;         // grid only matches the overview
  const c=g.c;
  c.save();c.strokeStyle='rgba(240,163,94,.45)';c.lineWidth=1;c.setLineDash([4,4]);
  c.beginPath();
  for(let px=0;px<pxN;px++){
    const t=tc[Math.min(tc.length-1,Math.floor(tc.length*px/pxN))];
    const y=Y(t);px?c.lineTo(g.x0+px,y):c.moveTo(g.x0+px,y);
  }
  c.stroke();c.restore();
}

function drawNoiseMarkers(m,g,Xf,Y,fLo,fHi,pts,pxN){
  const an=m.analysis;
  if(!an||an.error||!an.families)return;
  // The server re-samples marker levels against the current spectrum every
  // frame, so `nfft` here already matches the frame; only an fs/channel
  // change invalidates the structure, and that arrives flagged stale.
  if(an.stale)return;
  if(Math.abs(an.fs_hz-m.fs_hz)>1||an.channel!==m.cfg.channel)return;
  const c=g.c||$('cFreq').getContext('2d');
  const tickTop=g.y0+2, tickLen=7;
  const st=(noiseStruct&&noiseStruct.sid===an.sid)?noiseStruct:null;
  if(!st)return;                       // structure not fetched yet
  const freqsOf=id=>{const e=st.families.find(x=>x.id===id);return e?e.freqs:[]};
  an.families.forEach((fam,i)=>{
    const col=famColor(fam.id!=null?fam.id:i);
    c.strokeStyle=col;c.fillStyle=col;c.lineWidth=1;
    const ff=freqsOf(fam.id);
    const sel=pixelReduce(ff,null,Xf,g.x0,pxN,fLo,fHi);
    for(let px=0;px<pxN;px++){
      const k=sel[px];
      if(k<0)continue;
      const x=Xf(ff[k]);
      c.beginPath();c.moveTo(x,tickTop);c.lineTo(x,tickTop+tickLen);c.stroke();
      // Sit the dot on the value the polyline actually has at this pixel.
      // In the overview one pixel max-pools thousands of bins, so a dot
      // placed at the single-bin level floats several dB below the curve it
      // is meant to annotate; zoomed in, pixel ~ bin and the two coincide.
      const y=Y(plotAt(x,g,pts,pxN,fam.peak_db));
      c.beginPath();c.arc(x,y,1.9,0,7);c.fill();
    }
  });
  c.fillStyle=SPUR_COLOR;c.strokeStyle=SPUR_COLOR;
  // fainter and shorter as prominence falls, so the eye still ranks them
  const sf=st.spur_f||[], sp_=st.spur_p||[];
  const ssel=pixelReduce(sf,sp_,Xf,g.x0,pxN,fLo,fHi);
  for(let px=0;px<pxN;px++){
    const i=ssel[px];
    if(i<0)continue;
    const x=Xf(sf[i]);
    const w=Math.max(0.25,Math.min(1,(sp_[i]||0)/12));
    c.globalAlpha=0.35+0.65*w;
    c.beginPath();c.moveTo(x,tickTop);c.lineTo(x,tickTop+tickLen*(0.4+0.6*w));c.stroke();
    c.beginPath();c.arc(x,Y(plotAt(x,g,pts,pxN,null)),1.1+0.9*w,0,7);c.fill();
  }
  c.globalAlpha=1;
}

function drawBudget(a){
  const parts=[
    ['capture (real measurement)',a.capture_ms,'var(--seg-cap)'],
    ['DMA readback',a.dma_ms,'var(--seg-dma)'],
    ['GPU FFT',a.gpu_wall_ms,'var(--seg-gpu)'],
  ];
  const known=parts.reduce((s,p)=>s+p[1],0);
  const oh=Math.max(0,a.loop_ms-known);
  parts.push(['overhead (re-arm, JSON, loop)',oh,'var(--seg-oh)']);
  const total=Math.max(1e-6,a.loop_ms);
  $('tbar').innerHTML=parts.map(([n,v,col])=>
    `<i style="width:${Math.max(0,v/total*100).toFixed(2)}%;background:${col}" title="${n}: ${v.toFixed(3)} ms (${(v/total*100).toFixed(1)}%)"></i>`).join('');
  $('tbarLegend').innerHTML=parts.map(([n,v,col])=>
    `<span><i style="background:${col}"></i>${n} ${(v/total*100).toFixed(0)}%</span>`).join('');
}

function flashDot(){
  const d=$('acqDot');d.classList.remove('flash');void d.offsetWidth;d.classList.add('flash');
}

function renderNoise(m){
  const an=m.analysis, card=$('cardNoise');
  if(!+$('classify').value && !an){card.style.display='none';return}
  card.style.display='';
  if(!an){$('noiseInfo').textContent='analysing…';$('noiseList').innerHTML='';
    $('noiseNote').textContent='First pass runs within ~1 s of enabling.';return}
  if(an.error){$('noiseInfo').textContent='error';
    $('noiseList').innerHTML='';$('noiseNote').textContent=an.error;return}
  if(an.stale){$('noiseInfo').textContent='reanalysing…';$('noiseList').innerHTML='';
    $('noiseNote').textContent=`Configuration changed (${an.reason}); the next pass lands within ~1 s.`;return}
  const shown=(noiseStruct&&noiseStruct.sid===an.sid)?noiseStruct.spurs.length:0;
  $('noiseInfo').textContent=`${an.n_peaks} peaks · ${an.families.length} families`
    + (an.structure_nfft&&an.structure_nfft!==m.cfg.nfft?' · refitting':'');
  ensureNoiseStruct(an.sid);
  const rows=an.families.map((fam,i)=>{
    const col=famColor(fam.id!=null?fam.id:i);
    return `<div class="nfam"><i style="background:${col}"></i><div class="nf">
      <div class="nt">${eng(fam.f0_hz)} · ${fam.label.replace(/_/g,' ')}</div>
      <div class="nd">${fam.n_members} harmonics · density ${f(fam.density,2)}
        · ${f(fam.significance,0)}σ · peak ${f(fam.peak_db,1)} dBFS</div></div></div>`;
  });
  const stc=(noiseStruct&&noiseStruct.sid===an.sid)?noiseStruct:null;
  if(stc&&(stc.spur_f||[]).length){
    const n=stc.spur_f.length;
    const top=[];
    for(let i=0;i<Math.min(5,n);i++)top.push(eng(stc.spur_f[i])+' +'+f(stc.spur_p[i],1)+' dB');
    rows.push(`<div class="nfam"><i style="background:${SPUR_COLOR}"></i><div class="nf">
      <div class="nt">${n} unmatched lines · all marked</div>
      <div class="nd">strongest by prominence: ${top.join(' · ')}</div>
      </div></div>`);
  }
  $('noiseList').innerHTML=rows.join('')||
    '<div class="nfam"><div class="nf"><div class="nd">no families above threshold</div></div></div>';
  $('noiseNote').innerHTML=`Every detected peak is marked; at most one marker
    per pixel is drawn (the most prominent), so zoom in to resolve the rest.
    The dashed amber line is the detection threshold — anything under it is
    not distinguishable from noise at this averaging depth, so raise
    <b>FFT frames</b>/<b>Trace avg</b> (lowers the bar physically) or
    <b>Sensitivity</b> (accepts more false alarms).
    Floor ${f(an.floor_db,1)} dBFS, CFAR threshold
    +${f(an.thr_db,1)} dB (P<sub>fa</sub>=1e-6). Labels are inferred from
    structure — confirm a source by intervention (change fs, terminate the
    input, compare channels): <code>tools/emi_sweep.py</code>.`;
}

// On load the selects show their own defaults while the server keeps
// whatever config it was already running -- so the panel could read
// "Classify: off" next to a populated Noise sources card. Adopt the
// server's values once, on the first frame.
let ctlsSynced=false;
function syncControlsFromServer(m){
  if(ctlsSynced||!m||!m.cfg)return;
  ctlsSynced=true;
  buildNsampleOpts(MAX_SAMPLES);
  CTL_IDS.forEach(id=>{
    if(!(id in m.cfg))return;
    const el=$(id), want=String(m.cfg[id]);
    if(id==='nfft'){
      // 'auto' is a client-side mode; keep it only if the server's nfft is
      // what auto would have chosen
      if(autoNfft&&+want===effAutoNfft()){el.value='auto';return}
      autoNfft=false;buildNfftOpts(+$('nsamples').value||1048576);
    }
    if([...el.options].some(o=>o.value===want))el.value=want;
  });
  if($('nsamples').value)buildNfftOpts(+$('nsamples').value);
}

// one colour per trace, used in BOTH plots so a channel is identifiable
const TRACE_COLORS=['#7ee787','#5ea8f0'];
// coloured chips so the two channels can be told apart at a glance
function traceLegend(T){
  if(!T||T.length<2)return '';
  return T.map((t,k)=>`<span style="color:${TRACE_COLORS[k%TRACE_COLORS.length]}">`
      +`\u25cf ${t.name||('t'+k)}</span>`).join(' ')+' · ';
}
const TRACE_FILL=['rgba(126,231,135,.20)','rgba(94,168,240,.18)'];
function render(m,T,zoomSpec){
  if(m.volt_scale)VOLT_SCALE=m.volt_scale;
  syncControlsFromServer(m);
  drawTime(m,T);drawFreq(m,T,zoomSpec);drawBudget(m.acq);
  renderNoise(m);checkApplied(m);
  const a=m.acq,g=m.gpu,s=m.sig,y=m.sys,t=m.totals;
  const cov=a.coverage_pct;
  fill($('tAcq'),[
    ['capture','<b>'+f(a.capture_ms,3)+'</b> ms',a.capture_suspect?'v-bad':''],
    ['↳ theoretical',f(a.capture_theory_ms,3)+' ms',a.capture_suspect?'v-bad':''],
    ...(a.capture_suspect?[['⚠ capture','IMPOSSIBLY FAST','v-bad']]:[]),
    ['read back',(a.read_samples||0).toLocaleString()+' ('+f(a.read_pct,1)+'%)',
       a.read_pct<100?'v-warn':''],
    ['DMA readback',f(a.dma_ms,3)+' ms'],
    ['DMA bandwidth',f(a.dma_gbps,2)+' GB/s',a.dma_gbps>0.15?'v-good':'v-warn'],
    ['DMA path',(a.dma_path||'').split(' ')[0],
       (a.dma_path||'').includes('failed')?'v-bad':''],
    ['GPU (wall)',f(a.gpu_wall_ms,3)+' ms'],
    ['loop total','<b>'+f(a.loop_ms,3)+'</b> ms'],
    ['frame rate','<b>'+f(a.fps,1)+'</b> /s'],
    ['duty cycle',f(a.duty_pct,1)+' %'],
    ['coverage',f(cov,2)+' %',cov>50?'v-good':cov>5?'v-warn':'v-bad'],
    ['effective rate',f(a.eff_msps,2)+' Msps'],
    ['frames',t.frames.toLocaleString()],
    ['samples',t.samples.toLocaleString()],
    ['data moved',si(t.bytes)],
    ['timeouts',t.timeouts,t.timeouts?'v-bad':'v-good'],
    ['uptime',dur(t.uptime_s)],
  ]);
  fill($('tGpu'),[
    ['H2D copy',f(g.h2d_ms,3)+' ms'],
    ['convert+window+env',f(g.kern_ms,3)+' ms'],
    ['cuFFT',f(g.fft_ms,3)+' ms'],
    ['power→dB + D2H',f(g.post_ms,3)+' ms'],
    ['GPU total','<b>'+f(g.total_ms,3)+'</b> ms'],
    ['FFT throughput',f(g.fft_gsps,2)+' GS/s','v-good'],
    ['batch',m.nframes+' × '+m.cfg.nfft],
    ['GPU mem used',si(g.mem_total-g.mem_free)+' / '+si(g.mem_total)],
  ]);
  // in dual mode report BOTH channels, since both were captured together
  if(m.dual){
    const rows=Object.entries(m.dual).map(([k,v])=>
      [`ch ${k}`,`${f(v.mean,1)} ± ${f(v.std,2)} (${v.min}–${v.max})`,
       (v.max>=16380||v.min<=2)?'v-bad':'']);
    fill($('tSig'),rows.concat([['—','both captured in the same window']]));
  } else
  fill($('tSig'),[
    ['peak',eng(s.peak_hz)],
    ['peak level',f(s.peak_db,2)+' dBFS'],
    ['noise floor (med)',f(s.noise_db,1)+' dBFS'],
    ['peak / floor',f(s.snr_db,1)+' dB'],
    ['mean (DC)',f(mV(s.mean),2)+' mV'],
    ['std (RMS ac)',f(mV(s.std),3)+' mV'],
    ['pk-pk',f(mV(s.vpp_codes),2)+' mV'],
    ['full-scale used',f(100*s.vpp_codes/16384,3)+' %'],
    ['std (RMS ac)',f(s.std,2)+' codes'],
    ['min / max',s.min+' / '+s.max],
    ['pk-pk',s.vpp_codes+' codes'],
    ['clipping',s.clipping?'YES':'no',s.clipping?'v-bad':'v-good'],
  ]);
  const tmp=Object.entries(y.temps||{}).slice(0,4)
      .map(([k,v])=>[k,f(v,1)+' °C',v>75?'v-warn':'']);
  fill($('tSys'),[
    ['CPU',f(y.cpu_pct,1)+' %',y.cpu_pct>90?'v-warn':''],
    ['RAM',si(y.mem_used)+' / '+si(y.mem_total)],
    ...tmp,
  ]);
  $('stFps').textContent=m.engine.running?f(a.fps,1)+' fps':'single-shot';
  {
    const nn=(y||{}).net;
    let txt='net: wired/local';
    if(nn&&isFinite(nn.rssi_dbm)){
      const r=nn.rssi_dbm;
      const bars=r>=-55?'▂▄▆█':r>=-65?'▂▄▆':r>=-72?'▂▄':r>=-80?'▂':'·';
      txt=`${bars} ${f(r,0)} dBm`+(nn.tx_mbps?` · ${f(nn.tx_mbps,0)} Mb/s`:'');
    }
    if(netLag>5)txt+=` · lag ${f(netLag,0)} ms`;
    if(paceMs>45)txt+=` · ${f(1000/Math.max(33,paceMs*0.9),0)} fps shown`;
    const bad=(nn&&nn.rssi_dbm<-80)||netLag>400, warn=(nn&&nn.rssi_dbm<-70)||netLag>150;
    $('stNet').textContent=txt;
    $('stNet').className='badge '+(bad?'err':warn?'off':'on');
  }
  $('stCov').textContent=f(cov,1)+'% coverage';
  $('stCov').className='badge '+(cov>50?'on':'off');
  $('stSrc').textContent=(s.is_test_ramp?'TEST RAMP (not ADC) · ':'ADC ch '+m.cfg.channel+' · ')+m.cfg.nsamples.toLocaleString()+' pts';
  $('stSrc').className='badge '+(s.is_test_ramp?'off':'on');
}

// ---- lightweight status: authoritative running/error state, polled every
// tick independently of the (larger) /frame payload so the UI reflects
// "capturing / done / timed out" immediately, not only on a successful frame.
let engRunning=true, lastFrames=-1, singlePending=false, singleT0=0, singleBaseline=0;
let lastM=null, lastCaptureWall=0;

function updateEngineState(s){
  engRunning=s.running;
  $('bRun').textContent=s.running?'⏸ Stop':'▶ Run';
  $('bRun').className=s.running?'pri':'';
  let label,cls;
  if(singlePending){label='◐ capturing…';cls='off'}
  else if(s.running){label='● live';cls='on'}
  else {label='○ idle';cls=''}
  $('stAcq').textContent=label;$('stAcq').className='badge '+cls;
  if(s.err){$('err').style.display='block';$('err').textContent=s.err}
  else if(!singlePending){$('err').style.display='none'}
}

setInterval(()=>{
  if(!lastM)return;
  $('acqInfo').textContent = engRunning
    ? `frame #${lastM.totals.frames.toLocaleString()} · streaming`
    : `frame #${lastM.totals.frames.toLocaleString()} · ${ago((Date.now()-lastCaptureWall)/1000)}`;
},200);

// Long-poll: ONE request per frame -- the server parks it until a frame
// newer than `since` exists (204 after ~25 s of nothing). Compared with the
// old status-poll-per-animation-frame this cuts the request rate ~10x and,
// on a lossy WiFi link, turns "a burst of delayed polls" into "one delayed
// frame", which is the difference between stutter and a barely-visible skip.
let netLag=0;    // EWMA ms: frame arrival delay beyond engine production time
let netFails=0;  // consecutive failures, so one hiccup does not flip the badge
let paceMs=0;    // EWMA of how long a frame actually takes to arrive
async function poll(){
  while(true){
    const tStart=performance.now();
    try{
      const t0=performance.now();
      const r=await fetch('/frame?wait=1&since='+(lastFrames<0?0:lastFrames),
                          {cache:'no-store'});
      if(r.status===200){
        const buf=await r.arrayBuffer();
        const dv=new DataView(buf);const hl=dv.getUint32(0,true);
        const m=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,4,hl)));
        let off=4+hl;
        // wire 2: spectrum as int16 hundredths of a dB, envelope as uint16
        // ADC codes (exact). Halves the payload on a link that cannot carry
        // the engine's full frame rate anyway.
        const sc=m.disp_scale||100, ms=m.tmean_scale||4;
        const i16=(n,d)=>{const a=new Int16Array(buf.slice(off,off+n*2));off+=n*2;
                        const o=new Float32Array(n);
                        for(let i=0;i<n;i++)o[i]=a[i]/d;return o};
        // wire 5: one array group per trace -- disp, [zoom on trace 0], tmin,
        // tmax, tmean. Dual-channel sends two groups so both can be drawn.
        const nTr=Math.max(1,m.n_traces||1), tw=m.trace_width;
        const T=[];
        let zoomSpec=null;
        for(let k=0;k<nTr;k++){
          const spec=i16(m.disp_bins,sc);
          if(k===0&&m.zoom&&m.zoom.active&&m.zoom.bins>0)zoomSpec=i16(m.zoom.bins,sc);
          const tmin=i16(tw,1), tmax=i16(tw,1), tmean=i16(tw,ms);
          T.push({name:(m.traces&&m.traces[k])||'',spec,tmin,tmax,tmean});
        }
        const lag=Math.max(0,(performance.now()-t0)-m.acq.loop_ms);
        netLag=netLag?netLag*0.75+lag*0.25:lag;
        lastFrames=m.totals.frames;
        lastM=m;lastCaptureWall=Date.now();
        updateEngineState({running:m.engine.running,err:m.err,frames:lastFrames});
        if(singlePending && (lastFrames>singleBaseline)){
          singlePending=false;$('bSingle').disabled=false;$('bSingle').textContent='⚡ Single';
        }
        render(m,T,zoomSpec);
        flashDot();
      }else if(r.status===204||r.status===503){
        // nothing new inside the window (paused engine, or an error is
        // stopping captures): one cheap status check keeps badges honest
        const s=await (await fetch('/status',{cache:'no-store'})).json();
        if(lastFrames<0)lastFrames=s.frames;
        updateEngineState(s);
        if(singlePending && (s.err || performance.now()-singleT0>30000)){
          singlePending=false;$('bSingle').disabled=false;$('bSingle').textContent='⚡ Single';
        }
        if(r.status===503)await new Promise(rs=>setTimeout(rs,300));
      }
      netFails=0;
      $('st').textContent='live';$('st').className='badge on';
    }catch(e){
      // A single failed fetch is normal on a marginal link; only call it
      // disconnected once several in a row fail, otherwise the badge flaps.
      netFails++;
      if(netFails>=3){$('st').textContent='disconnected';$('st').className='badge err'}
      else{$('st').textContent='reconnecting…';$('st').className='badge off'}
      await new Promise(rs=>setTimeout(rs,Math.min(2000,300*netFails)));
    }
    // Pace requests to what the link actually sustains. The engine can
    // produce 66 fps of ~27 kB frames (~14 Mbit/s) on a 7 Mbit/s link; asking
    // for every one of them saturates it, queues TCP, and ends in timeouts
    // that look like disconnections. The long-poll always returns the NEWEST
    // frame, so backing off just skips frames -- which is exactly right.
    const took=performance.now()-tStart;
    paceMs=paceMs?paceMs*0.7+took*0.3:took;
    const gap=Math.max(33,Math.min(1000,paceMs*0.9))-(performance.now()-tStart);
    if(gap>0)await new Promise(rs=>setTimeout(rs,gap));
    await new Promise(rs=>requestAnimationFrame(rs));
  }
}

async function send(o){
  try{await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(o)})}catch(e){}
}
$('bRun').addEventListener('click',()=>send({running:!engRunning}));
$('bSingle').addEventListener('click',()=>{
  if(singlePending)return;
  singlePending=true;singleT0=performance.now();singleBaseline=lastFrames;
  $('bSingle').disabled=true;$('bSingle').textContent='Capturing…';
  send({trigger:true});
});
$('tLock').addEventListener('change',e=>{tLock=e.target.checked});
$('persist').addEventListener('change',e=>{
  persistTau=+e.target.value;      // 0 off, -1 infinite hold
  pKey='';fHold=null;              // force a clean accumulator and axis snap
});
$('bReset').addEventListener('click',()=>location.reload());
$('bRestart').addEventListener('click',async()=>{
  if(!confirm('Restart the whole server process?\n\nThis drops the live feed for EVERYONE currently viewing this page, not just you, and the engine comes back with its default startup config rather than your current settings.\n\nContinue?'))return;
  $('bRestart').disabled=true;$('bRestart').textContent='Restarting…';
  try{await fetch('/restart',{method:'POST'})}catch(e){}
  await new Promise(r=>setTimeout(r,1500));   // give the process a moment to actually exit first
  for(let i=0;i<30;i++){
    try{
      const r=await fetch('/status',{cache:'no-store'});
      if(r.ok){location.reload();return}
    }catch(e){}
    await new Promise(r=>setTimeout(r,1000));
  }
  $('bRestart').disabled=false;$('bRestart').textContent='⟲ Restart server (not back yet — check manually)';
});

// ---- drag-to-zoom on the spectrum: select a band, server sends back a
// full-resolution slice of just that band (see /control {zoom:[lo,hi]}
// handling in server.py). freqAxis (set at the end of each drawFreq call)
// gives the pixel<->Hz mapping for whichever view (overview or zoom) is
// currently on screen, so dragging inside an existing zoom refines it further.
const cFreqEl=$('cFreq');
let dragX0=null;
function overlayRect(x0,x1){
  const cv=$('cFreq'),c=cv.getContext('2d'),d=window.devicePixelRatio||1;
  c.setTransform(d,0,0,d,0,0);
  const r=cv.getBoundingClientRect();
  const lo=Math.min(x0,x1),hi=Math.max(x0,x1);
  c.fillStyle='rgba(240,163,94,.18)';c.fillRect(lo,0,hi-lo,r.height);
  c.strokeStyle='rgba(240,163,94,.8)';c.lineWidth=1;
  c.strokeRect(lo+0.5,0.5,hi-lo-1,r.height-1);
}
cFreqEl.addEventListener('mousedown',e=>{dragX0=e.offsetX});
window.addEventListener('mousemove',e=>{
  if(dragX0==null)return;
  overlayRect(dragX0,e.offsetX);
});
window.addEventListener('mouseup',e=>{
  if(dragX0==null)return;
  const x0=dragX0;dragX0=null;
  if(!freqAxis)return;
  const x1=e.offsetX;
  if(Math.abs(x1-x0)<4)return;                 // treat as a click, not a drag
  const p0=Math.max(0,Math.min(1,(Math.min(x0,x1)-freqAxis.x0)/freqAxis.pw));
  const p1=Math.max(0,Math.min(1,(Math.max(x0,x1)-freqAxis.x0)/freqAxis.pw));
  if(p1-p0<0.005)return;                        // selection collapsed off-plot
  const lo=freqAxis.fromP(p0),hi=freqAxis.fromP(p1);
  fBounds=null;                                 // Y autoscale to the new band
  send({zoom:[lo,hi]});
});
$('bZoomReset').addEventListener('click',()=>{fBounds=null;send({zoom:null})});
cFreqEl.addEventListener('dblclick',()=>{fBounds=null;send({zoom:null})});

window.addEventListener('resize',()=>{});
poll();
</script></body></html>
